<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedVision – Core Imaging Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header>
    <div class="brand">
      <span class="brand-icon">🔬</span>
      <span class="brand-name">MedVision</span>
      <span class="brand-version">v0.1</span>
    </div>
    <nav class="lab-tabs">
      <button class="tab active" data-lab="core">Core Imaging Lab</button>
      <button class="tab disabled" title="Coming soon">DICOM Lab</button>
      <button class="tab disabled" title="Coming soon">Classical Pipeline</button>
      <button class="tab disabled" title="Coming soon">Pattern Insight</button>
      <button class="tab disabled" title="Coming soon">AI / DL Lab</button>
    </nav>
  </header>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main>

    <!-- ── Upload panel ──────────────────────────────────────────────────── -->
    <section class="panel" id="upload-panel">
      <h2>1 · Upload Image</h2>
      <div class="drop-zone" id="drop-zone">
        <span id="drop-label">Drop a PNG / JPG here, or click to browse</span>
        <input type="file" id="file-input" accept="image/png,image/jpeg" hidden />
      </div>
      <button class="btn primary" id="upload-btn" disabled>Upload →</button>
      <div class="meta-box hidden" id="upload-meta"></div>
    </section>

    <!-- ── Process panel ─────────────────────────────────────────────────── -->
    <section class="panel" id="process-panel">
      <h2>2 · Process Image</h2>
      <div class="row">
        <label for="proc-select">Processing type</label>
        <select id="proc-select">
          <option value="kmeans">K-Means Clustering</option>
          <option value="gaussian">Gaussian Blur</option>
          <option value="sobel">Sobel Edge Detection</option>
        </select>
        <button class="btn primary" id="process-btn" disabled>Process →</button>
      </div>

      <!-- Image comparison -->
      <div class="image-row" id="image-row">
        <figure>
          <figcaption>Original</figcaption>
          <img id="original-img" alt="Original image" />
        </figure>
        <figure>
          <figcaption>Processed</figcaption>
          <img id="processed-img" alt="Processed image" />
          <div class="spinner hidden" id="proc-spinner">⏳ Processing…</div>
        </figure>
      </div>
    </section>

    <!-- ── Features panel ────────────────────────────────────────────────── -->
    <section class="panel" id="features-panel">
      <h2>3 · Extract Features</h2>
      <button class="btn secondary" id="features-btn" disabled>Extract Features →</button>
      <div class="spinner hidden" id="feat-spinner">⏳ Extracting…</div>

      <!-- Stats cards -->
      <div class="stats-grid hidden" id="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Mean Intensity</div>
          <div class="stat-value" id="stat-mean">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Std Deviation</div>
          <div class="stat-value" id="stat-std">—</div>
        </div>
      </div>

      <!-- Histogram canvas -->
      <div class="hist-wrap hidden" id="hist-wrap">
        <h3>Intensity Histogram</h3>
        <canvas id="hist-canvas" width="600" height="200"></canvas>
      </div>

      <!-- Raw JSON -->
      <details class="json-details hidden" id="feat-json-details">
        <summary>Raw JSON response</summary>
        <pre id="feat-json"></pre>
      </details>
    </section>

  </main>

  <!-- ── Toast notification ────────────────────────────────────────────────── -->
  <div class="toast hidden" id="toast"></div>

  <script>
    /* =====================================================================
       MedVision – Core Imaging Lab frontend script
       What it does:
         1. Manages file selection / drag-and-drop and uploads to the backend.
         2. Calls the process endpoint and renders the result image.
         3. Calls the features endpoint and renders stats + histogram.
       Why it is inline:
         Keeping JS inline avoids a build step; the frontend is intentionally
         simple and requires no bundler.
    ===================================================================== */

    const API = "http://127.0.0.1:8000/api/core-imaging";

    let imageId   = null;   // set after a successful upload
    let objectUrl = null;   // revoke previous blob URL when a new one is created

    /* ── DOM refs ─────────────────────────────────────────────────────── */
    const dropZone     = document.getElementById("drop-zone");
    const fileInput    = document.getElementById("file-input");
    const dropLabel    = document.getElementById("drop-label");
    const uploadBtn    = document.getElementById("upload-btn");
    const uploadMeta   = document.getElementById("upload-meta");
    const procSelect   = document.getElementById("proc-select");
    const processBtn   = document.getElementById("process-btn");
    const featuresBtn  = document.getElementById("features-btn");
    const originalImg  = document.getElementById("original-img");
    const processedImg = document.getElementById("processed-img");
    const procSpinner  = document.getElementById("proc-spinner");
    const featSpinner  = document.getElementById("feat-spinner");
    const statsGrid    = document.getElementById("stats-grid");
    const statMean     = document.getElementById("stat-mean");
    const statStd      = document.getElementById("stat-std");
    const histWrap     = document.getElementById("hist-wrap");
    const histCanvas   = document.getElementById("hist-canvas");
    const featJsonDetails = document.getElementById("feat-json-details");
    const featJson     = document.getElementById("feat-json");
    const toast        = document.getElementById("toast");

    /* ── Toast helper ─────────────────────────────────────────────────── */
    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className   = "toast" + (isError ? " error" : "");
      setTimeout(() => { toast.className = "toast hidden"; }, 3500);
    }

    /* ── File selection ───────────────────────────────────────────────── */
    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });

    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));

    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(f) {
      dropLabel.textContent = f.name;
      uploadBtn.disabled = false;
      // Preview
      const reader = new FileReader();
      reader.onload = ev => { originalImg.src = ev.target.result; };
      reader.readAsDataURL(f);
    }

    /* ── Upload ───────────────────────────────────────────────────────── */
    uploadBtn.addEventListener("click", async () => {
      const f = fileInput.files[0];
      if (!f) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading…";

      const fd = new FormData();
      fd.append("file", f);

      try {
        const res  = await fetch(`${API}/upload`, { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);

        imageId = data.image_id;
        uploadMeta.innerHTML = `
          <strong>✅ Upload successful</strong><br/>
          <code>image_id: ${data.image_id}</code><br/>
          ${data.width} × ${data.height} px &nbsp;|&nbsp; ${(data.size_bytes/1024).toFixed(1)} KB
        `;
        uploadMeta.classList.remove("hidden");
        processBtn.disabled  = false;
        featuresBtn.disabled = false;
        showToast("Image uploaded successfully.");
      } catch (err) {
        showToast("Upload failed: " + err.message, true);
      } finally {
        uploadBtn.disabled  = false;
        uploadBtn.textContent = "Upload →";
      }
    });

    /* ── Process ──────────────────────────────────────────────────────── */
    processBtn.addEventListener("click", async () => {
      if (!imageId) return;
      processBtn.disabled = true;
      procSpinner.classList.remove("hidden");
      processedImg.src = "";

      const fd = new FormData();
      fd.append("image_id", imageId);
      fd.append("processing_type", procSelect.value);

      try {
        const res = await fetch(`${API}/process`, { method: "POST", body: fd });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || res.statusText);
        }
        const blob = await res.blob();
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl       = URL.createObjectURL(blob);
        processedImg.src = objectUrl;
        showToast(`Processing (${procSelect.value}) complete.`);
      } catch (err) {
        showToast("Processing failed: " + err.message, true);
      } finally {
        processBtn.disabled = false;
        procSpinner.classList.add("hidden");
      }
    });

    /* ── Features ─────────────────────────────────────────────────────── */
    featuresBtn.addEventListener("click", async () => {
      if (!imageId) return;
      featuresBtn.disabled = true;
      featSpinner.classList.remove("hidden");
      statsGrid.classList.add("hidden");
      histWrap.classList.add("hidden");
      featJsonDetails.classList.add("hidden");

      try {
        const res  = await fetch(`${API}/features/${imageId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);

        statMean.textContent = data.mean.toFixed(2);
        statStd.textContent  = data.std_dev.toFixed(2);
        statsGrid.classList.remove("hidden");

        drawHistogram(data.histogram.bins, data.histogram.counts);
        histWrap.classList.remove("hidden");

        featJson.textContent = JSON.stringify(data, null, 2);
        featJsonDetails.classList.remove("hidden");
        showToast("Features extracted.");
      } catch (err) {
        showToast("Feature extraction failed: " + err.message, true);
      } finally {
        featuresBtn.disabled = false;
        featSpinner.classList.add("hidden");
      }
    });

    /* ── Histogram renderer ───────────────────────────────────────────── */
    function drawHistogram(bins, counts) {
      const ctx    = histCanvas.getContext("2d");
      const W      = histCanvas.width;
      const H      = histCanvas.height;
      const pad    = { top: 10, right: 10, bottom: 30, left: 40 };
      const plotW  = W - pad.left - pad.right;
      const plotH  = H - pad.top  - pad.bottom;
      const maxCnt = Math.max(...counts);

      ctx.clearRect(0, 0, W, H);

      // Background
      ctx.fillStyle = "#1a1a2e";
      ctx.fillRect(0, 0, W, H);

      // Bars
      const barW = plotW / bins.length;
      bins.forEach((bin, i) => {
        const barH = (counts[i] / maxCnt) * plotH;
        const x    = pad.left + i * barW;
        const y    = pad.top  + plotH - barH;
        // Gradient from dark-blue to cyan based on intensity
        const t    = bin / 255;
        ctx.fillStyle = `hsl(${190 + t * 60}, 80%, ${30 + t * 40}%)`;
        ctx.fillRect(x, y, Math.max(barW - 0.5, 0.5), barH);
      });

      // Axes
      ctx.strokeStyle = "#888";
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.moveTo(pad.left, pad.top);
      ctx.lineTo(pad.left, pad.top + plotH);
      ctx.lineTo(pad.left + plotW, pad.top + plotH);
      ctx.stroke();

      // X-axis labels (0, 64, 128, 192, 255)
      ctx.fillStyle  = "#aaa";
      ctx.font       = "10px monospace";
      ctx.textAlign  = "center";
      [0, 64, 128, 192, 255].forEach(v => {
        const x = pad.left + (v / 255) * plotW;
        ctx.fillText(v, x, H - 8);
      });
    }
  </script>
</body>
</html>
